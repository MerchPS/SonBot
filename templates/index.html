<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Bimoli Soundboard + Live</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a1a;
            min-height: 100vh;
            user-select: none;
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        
        /* ===== SOUNDBOARD (ATAS - 40%) ===== */
        .soundboard-section {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 6px;
            flex: 4;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 6px;
        }
        .header h1 { font-size: 15px; }
        .status-mini {
            font-size: 10px; padding: 3px 8px; border-radius: 10px;
            background: rgba(255,255,255,0.1);
        }
        
        .volume-bar {
            background: rgba(255,255,255,0.08); border-radius: 8px;
            padding: 6px 10px; margin: 3px 0;
        }
        .volume-header { display: flex; justify-content: space-between; margin-bottom: 2px; }
        .volume-label { font-size: 10px; }
        .volume-value { font-size: 11px; color: #e94560; font-weight: bold; }
        .volume-presets { display: flex; gap: 3px; margin-bottom: 3px; }
        .volume-preset {
            flex: 1; padding: 3px; border-radius: 5px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05); color: white;
            cursor: pointer; font-size: 9px; text-align: center;
        }
        .volume-preset.active { background: #e94560; }
        .volume-slider-container { display: flex; align-items: center; gap: 5px; }
        input[type="range"] {
            -webkit-appearance: none; width: 100%; height: 5px;
            background: #e94560; border-radius: 3px; outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 20px; height: 20px;
            background: white; border-radius: 50%; border: 2px solid #e94560;
        }
        
        .sound-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin: 3px 0;
            flex: 1;
            overflow-y: auto;
        }
        .sound-card {
            background: rgba(255,255,255,0.08); border-radius: 8px;
            padding: 8px 4px; cursor: pointer; text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; min-height: 55px;
            transition: all 0.15s;
        }
        .sound-card:active { transform: scale(0.95); background: #e94560; }
        .sound-emoji { font-size: 22px; margin-bottom: 2px; }
        .sound-name { font-weight: bold; font-size: 10px; word-break: break-word; }
        .sound-info { font-size: 8px; color: #a8b2d1; }
        
        .controls-row { display: flex; gap: 4px; margin-top: 3px; }
        .btn-stop {
            flex: 1; padding: 8px; background: #e94560; color: white;
            border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold;
        }
        .btn-refresh {
            flex: 1; padding: 8px; background: #6441a5; color: white;
            border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold;
        }
        .btn-stop:active, .btn-refresh:active { transform: scale(0.98); }
        
        /* ===== LIVE CHAT (BAWAH - 60%) ===== */
        .chat-section {
            flex: 6;
            display: flex;
            flex-direction: column;
            background: #0d0d1f;
            border-top: 2px solid #e94560;
        }
        .chat-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 5px 10px; background: rgba(233,69,96,0.15);
            font-size: 11px;
        }
        .chat-iframe-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        .chat-iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .toast {
            position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(233,69,96,0.95); color: white; padding: 8px 16px;
            border-radius: 16px; font-size: 12px; z-index: 9999;
            animation: slideDown 0.3s; pointer-events: none;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e94560; border-radius: 3px; }
    </style>
</head>
<body>
    <!-- ===== SOUNDBOARD ===== -->
    <div class="soundboard-section" id="soundboardSection">
        <div class="header">
            <h1>🎵 Bimoli Soundboard</h1>
            <span class="status-mini" id="status">🟢</span>
        </div>
        
        <div class="volume-bar">
            <div class="volume-header">
                <span class="volume-label">🔊 Volume</span>
                <span class="volume-value" id="volumeValue">75%</span>
            </div>
            <div class="volume-presets">
                <button class="volume-preset" onclick="setVol(0.25)">25%</button>
                <button class="volume-preset" onclick="setVol(0.5)">50%</button>
                <button class="volume-preset active" onclick="setVol(0.75)">75%</button>
                <button class="volume-preset" onclick="setVol(1.0)">100%</button>
            </div>
            <div class="volume-slider-container">
                <span>🔊</span>
                <input type="range" id="volSlider" min="0" max="100" value="75" oninput="updVol(this.value)" onchange="setVol2(this.value)">
            </div>
        </div>
        
        <div class="sound-grid" id="soundGrid">
            <div style="grid-column:span 3;text-align:center;padding:20px;color:#a8b2d1;font-size:12px;">📭 Loading...</div>
        </div>
        
        <div class="controls-row">
            <button class="btn-stop" onclick="stopAll()">⏹️ STOP</button>
            <button class="btn-refresh" onclick="refreshChat()">🔄 REFRESH CHAT</button>
        </div>
    </div>
    
    <!-- ===== LIVE CHAT ===== -->
    <div class="chat-section">
        <div class="chat-header">
            <span>💬 Live Chat - <span id="liveStatus" style="color:#00ff00;">Menghubungkan...</span></span>
            <button onclick="refreshChat()" style="background:#e94560;color:white;border:none;padding:3px 8px;border-radius:4px;font-size:10px;cursor:pointer;">🔄</button>
        </div>
        <div class="chat-iframe-container" id="chatContainer">
            <div id="chatLoading" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#a8b2d1;z-index:10;">
                <div style="font-size:30px;">💬</div>
                <div style="font-size:11px;margin-top:5px;">Live Chat akan muncul disini</div>
                <div style="font-size:9px;color:#666;">Ketik URL live di bawah atau auto-detect</div>
            </div>
        </div>
    </div>
    
    <div id="toastContainer"></div>
    
    <script>
        // ===== SOUNDBOARD =====
        const socket = io();
        let semuaSuara = [];
        let vol = 0.75;
        
        // Config channel
        const CHANNEL_URL = "https://www.youtube.com/@TheMoiLee";
        let currentLiveId = null;
        
        socket.on('connect', () => { document.getElementById('status').textContent = '🟢'; socket.emit('get_sounds'); });
        socket.on('disconnect', () => { document.getElementById('status').textContent = '🔴'; });
        socket.on('sounds_list', (data) => {
            if (data.status === 'ok') {
                semuaSuara = data.suara;
                renderSuara();
                if (data.volume) { vol = data.volume; updVol(vol * 100); }
            }
        });
        socket.on('play_response', (data) => { if (data.status === 'ok') toast('🔊 ' + data.nama_suara); });
        socket.on('stop_response', () => toast('⏹️ Stopped!'));
        
        function updVol(v) {
            v = parseInt(v);
            document.getElementById('volSlider').value = v;
            document.getElementById('volumeValue').textContent = v + '%';
        }
        function setVol2(v) { vol = v / 100; socket.emit('set_volume', { volume: vol }); updVol(v); }
        function setVol(v) {
            vol = v; updVol(v * 100);
            socket.emit('set_volume', { volume: v });
            document.querySelectorAll('.volume-preset').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.volume-preset').forEach(b => {
                if (Math.abs(parseFloat(b.textContent)/100 - v) < 0.01) b.classList.add('active');
            });
        }
        
        function renderSuara() {
            const grid = document.getElementById('soundGrid');
            grid.innerHTML = '';
            if (semuaSuara.length === 0) {
                grid.innerHTML = '<div style="grid-column:span 3;text-align:center;padding:20px;color:#a8b2d1;font-size:12px;">📭 Belum ada suara</div>';
                return;
            }
            const em = { Bimoli: '🎭', Gaming: '🎮', Meme: '😂', Efek: '💥' };
            semuaSuara.sort((a, b) => (b.jumlah_main || 0) - (a.jumlah_main || 0));
            semuaSuara.forEach(s => {
                const card = document.createElement('div');
                card.className = 'sound-card';
                card.onclick = () => socket.emit('play_sound', { nama_file: s.nama_file, volume: vol });
                card.innerHTML = `<div class="sound-emoji">${em[s.kategori] || '🔊'}</div><div class="sound-name">${s.nama}</div><div class="sound-info">${s.jumlah_main || 0}x</div>`;
                grid.appendChild(card);
            });
        }
        
        function stopAll() { socket.emit('stop_all'); }
        function toast(m) {
            const c = document.getElementById('toastContainer');
            const t = document.createElement('div'); t.className = 'toast'; t.textContent = m;
            c.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(() => t.remove(), 300); }, 1500);
        }
        
        // ===== LIVE CHAT =====
        function getLiveUrl() {
            // Coba cek dari localStorage dulu
            const saved = localStorage.getItem('bimoli_live_url');
            if (saved) return saved;
            
            // Default: channel TheMoiLee
            return CHANNEL_URL;
        }
        
        function extractLiveVideoId(url) {
            // Kalo udah URL video live
            const liveMatch = url.match(/watch\?v=([a-zA-Z0-9_-]+)/);
            if (liveMatch) return liveMatch[1];
            
            // Kalo URL channel
            if (url.includes('@')) return null;
            
            return null;
        }
        
        function loadLiveChat() {
            const container = document.getElementById('chatContainer');
            const loading = document.getElementById('chatLoading');
            const url = getLiveUrl();
            
            // Coba fetch halaman channel buat dapetin live video ID
            fetch(url)
                .then(r => r.text())
                .then(html => {
                    // Cari video ID yang lagi live
                    const liveMatch = html.match(/"videoId":"([^"]+)".*?"title":{"runs":\[{"text":"([^"]+)"}/);
                    let videoId = null;
                    
                    if (liveMatch) {
                        videoId = liveMatch[1];
                    } else {
                        // Coba pattern lain
                        const match2 = html.match(/watch\?v=([a-zA-Z0-9_-]+)/);
                        if (match2) videoId = match2[1];
                    }
                    
                    if (videoId) {
                        currentLiveId = videoId;
                        document.getElementById('liveStatus').innerHTML = '<span style="color:#00ff00;">🟢 LIVE!</span>';
                        
                        // Embed live chat iframe
                        container.innerHTML = `
                            <iframe 
                                src="https://www.youtube.com/live_chat?v=${videoId}&embed_domain=${window.location.hostname}"
                                width="100%" 
                                height="100%" 
                                frameborder="0"
                                allowfullscreen>
                            </iframe>
                        `;
                        
                        if (loading) loading.style.display = 'none';
                        
                        toast('💬 Live chat terhubung!');
                    } else {
                        document.getElementById('liveStatus').textContent = '⚪ Tidak live';
                        if (loading) loading.innerHTML = '<div style="font-size:30px;">😴</div><div style="font-size:11px;">Channel sedang tidak live</div><div style="font-size:9px;color:#666;">Cek lagi nanti ya</div>';
                    }
                })
                .catch(() => {
                    document.getElementById('liveStatus').textContent = '⚠️ Error';
                    if (loading) loading.innerHTML = '<div style="font-size:30px;">❌</div><div style="font-size:11px;">Gagal menghubungi YouTube</div>';
                });
        }
        
        function refreshChat() {
            document.getElementById('chatLoading').style.display = 'block';
            document.getElementById('chatLoading').innerHTML = '<div style="font-size:30px;">🔄</div><div style="font-size:11px;">Refresh...</div>';
            document.getElementById('liveStatus').textContent = 'Menghubungkan...';
            loadLiveChat();
        }
        
        // ===== INIT =====
        updVol(75);
        loadLiveChat();
        
        // Auto refresh setiap 5 menit
        setInterval(loadLiveChat, 300000);
    </script>
</body>
</html>
