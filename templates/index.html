<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Bimoli Soundboard + Live</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a1a;
            min-height: 100vh;
            user-select: none;
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        
        /* ===== SOUNDBOARD ===== */
        .soundboard-section {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 6px;
            flex: 35;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            max-height: 40vh;
        }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 2px 6px; }
        .header h1 { font-size: 15px; }
        .status-mini { font-size: 10px; padding: 3px 8px; border-radius: 10px; background: rgba(255,255,255,0.1); }
        
        .volume-bar { background: rgba(255,255,255,0.08); border-radius: 8px; padding: 6px 10px; margin: 3px 0; }
        .volume-header { display: flex; justify-content: space-between; margin-bottom: 2px; }
        .volume-label { font-size: 10px; }
        .volume-value { font-size: 11px; color: #e94560; font-weight: bold; }
        .volume-presets { display: flex; gap: 3px; margin-bottom: 3px; }
        .volume-preset { flex: 1; padding: 3px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: white; cursor: pointer; font-size: 9px; text-align: center; }
        .volume-preset.active { background: #e94560; }
        .volume-slider-container { display: flex; align-items: center; gap: 5px; }
        input[type="range"] { -webkit-appearance: none; width: 100%; height: 5px; background: #e94560; border-radius: 3px; outline: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; background: white; border-radius: 50%; border: 2px solid #e94560; }
        
        .sound-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin: 3px 0; flex: 1; overflow-y: auto; }
        .sound-card { background: rgba(255,255,255,0.08); border-radius: 8px; padding: 8px 4px; cursor: pointer; text-align: center; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 50px; transition: all 0.15s; }
        .sound-card:active { transform: scale(0.95); background: #e94560; }
        .sound-emoji { font-size: 20px; margin-bottom: 2px; }
        .sound-name { font-weight: bold; font-size: 10px; word-break: break-word; }
        .sound-info { font-size: 8px; color: #a8b2d1; }
        
        .controls-row { display: flex; gap: 4px; margin-top: 3px; }
        .btn-stop { flex: 1; padding: 8px; background: #e94560; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-refresh { flex: 1; padding: 8px; background: #6441a5; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-stop:active, .btn-refresh:active { transform: scale(0.98); }
        
        /* ===== LIVE CHAT ===== */
        .chat-section { flex: 65; display: flex; flex-direction: column; background: #0d0d1f; border-top: 2px solid #e94560; }
        .chat-header { display: flex; justify-content: space-between; align-items: center; padding: 5px 10px; background: rgba(233,69,96,0.15); font-size: 11px; }
        .chat-iframe-container { flex: 1; position: relative; overflow: hidden; }
        .chat-iframe-container iframe { width: 100%; height: 100%; border: none; }
        
        .toast { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(233,69,96,0.95); color: white; padding: 8px 16px; border-radius: 16px; font-size: 12px; z-index: 9999; animation: slideDown 0.3s; pointer-events: none; }
        @keyframes slideDown { from { opacity: 0; transform: translateX(-50%) translateY(-20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e94560; border-radius: 3px; }
    </style>
</head>
<body>
    <!-- ===== SOUNDBOARD ===== -->
    <div class="soundboard-section" id="soundboardSection">
        <div class="header"><h1>🎵 Bimoli Soundboard</h1><span class="status-mini" id="status">🟢</span></div>
        
        <div class="volume-bar">
            <div class="volume-header"><span class="volume-label">🔊 Volume</span><span class="volume-value" id="volumeValue">75%</span></div>
            <div class="volume-presets">
                <button class="volume-preset" onclick="setVol(0.25)">25%</button>
                <button class="volume-preset" onclick="setVol(0.5)">50%</button>
                <button class="volume-preset active" onclick="setVol(0.75)">75%</button>
                <button class="volume-preset" onclick="setVol(1.0)">100%</button>
            </div>
            <div class="volume-slider-container">
                <span>🔊</span>
                <input type="range" id="volSlider" min="0" max="100" value="75" oninput="updVol(this.value)" onchange="setVol2(this.value)">
            </div>
        </div>
        
        <div class="sound-grid" id="soundGrid">
            <div style="grid-column:span 3;text-align:center;padding:20px;color:#a8b2d1;font-size:12px;">📭 Loading...</div>
        </div>
        
        <div class="controls-row">
            <button class="btn-stop" onclick="stopAll()">⏹️ STOP</button>
            <button class="btn-refresh" onclick="openLiveChat()">💬 LIVE CHAT</button>
        </div>
    </div>
    
    <!-- ===== LIVE CHAT ===== -->
    <div class="chat-section">
        <div class="chat-header">
            <span>💬 Live Chat - <span id="liveStatus" style="color:#ff0;">Klik tombol 💬 LIVE CHAT</span></span>
            <button onclick="openLiveChat()" style="background:#e94560;color:white;border:none;padding:3px 8px;border-radius:4px;font-size:10px;cursor:pointer;">🔄 Refresh</button>
        </div>
        <div class="chat-iframe-container" id="chatContainer">
            <div id="chatLoading" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#a8b2d1;z-index:10;">
                <div style="font-size:30px;">💬</div>
                <div style="font-size:11px;margin-top:5px;">Klik tombol LIVE CHAT di atas</div>
                <div style="font-size:9px;color:#666;">Bakal buka popup live chat YouTube</div>
            </div>
        </div>
    </div>
    
    <div id="toastContainer"></div>
    
    <script>
        // ===== SOUNDBOARD =====
        const socket = io();
        let semuaSuara = [];
        let vol = 0.75;
        
        socket.on('connect', () => { document.getElementById('status').textContent = '🟢'; socket.emit('get_sounds'); });
        socket.on('disconnect', () => { document.getElementById('status').textContent = '🔴'; });
        socket.on('sounds_list', (data) => {
            if (data.status === 'ok') { semuaSuara = data.suara; renderSuara(); if (data.volume) { vol = data.volume; updVol(vol * 100); } }
        });
        socket.on('play_response', (data) => { if (data.status === 'ok') toast('🔊 ' + data.nama_suara); });
        socket.on('stop_response', () => toast('⏹️ Stopped!'));
        
        function updVol(v) { v = parseInt(v); document.getElementById('volSlider').value = v; document.getElementById('volumeValue').textContent = v + '%'; }
        function setVol2(v) { vol = v / 100; socket.emit('set_volume', { volume: vol }); updVol(v); }
        function setVol(v) { vol = v; updVol(v * 100); socket.emit('set_volume', { volume: v }); document.querySelectorAll('.volume-preset').forEach(b => b.classList.remove('active')); document.querySelectorAll('.volume-preset').forEach(b => { if (Math.abs(parseFloat(b.textContent)/100 - v) < 0.01) b.classList.add('active'); }); }
        
        function renderSuara() {
            const grid = document.getElementById('soundGrid'); grid.innerHTML = '';
            if (semuaSuara.length === 0) { grid.innerHTML = '<div style="grid-column:span 3;text-align:center;padding:20px;color:#a8b2d1;font-size:12px;">📭 Belum ada suara</div>'; return; }
            const em = { Bimoli: '🎭', Gaming: '🎮', Meme: '😂', Efek: '💥' };
            semuaSuara.sort((a, b) => (b.jumlah_main || 0) - (a.jumlah_main || 0));
            semuaSuara.forEach(s => {
                const card = document.createElement('div'); card.className = 'sound-card';
                card.onclick = () => socket.emit('play_sound', { nama_file: s.nama_file, volume: vol });
                card.innerHTML = `<div class="sound-emoji">${em[s.kategori] || '🔊'}</div><div class="sound-name">${s.nama}</div><div class="sound-info">${s.jumlah_main || 0}x</div>`;
                grid.appendChild(card);
            });
        }
        
        function stopAll() { socket.emit('stop_all'); }
        function toast(m) { const c = document.getElementById('toastContainer'); const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; c.appendChild(t); setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(() => t.remove(), 300); }, 1500); }
        
        // ===== LIVE CHAT (POPUP) =====
        const CHANNEL_ID = "UCXuqSBlHAE6Xw-yeJA0Tunw"; // TheMoiLee channel ID
        
        async function openLiveChat() {
            document.getElementById('liveStatus').innerHTML = '<span style="color:#ff0;">🔍 Mencari live...</span>';
            document.getElementById('chatLoading').innerHTML = '<div style="font-size:30px;">🔍</div><div style="font-size:11px;">Mencari video live...</div>';
            
            try {
                // Cara 1: Coba embed live chat langsung
                const liveUrl = `https://www.youtube.com/live_chat?v=LIVE_VIDEO_ID&embed_domain=${window.location.hostname}`;
                
                // Cara 2: Fetch halaman channel buat dapetin video ID
                const response = await fetch(`https://www.youtube.com/@TheMoiLee`);
                const html = await response.text();
                
                // Cari live video badge
                let liveVideoId = null;
                
                // Pattern 1: "videoId":"xxx" + "badge":{"liveBadge"
                const match1 = html.match(/"videoId":"([^"]+)"[^}]+"badge":\{"liveBadge":/);
                if (match1) liveVideoId = match1[1];
                
                // Pattern 2: "isLive":true
                if (!liveVideoId) {
                    const match2 = html.match(/"videoId":"([^"]+)"[^}]+"isLive":true/);
                    if (match2) liveVideoId = match2[1];
                }
                
                // Pattern 3: Cari LIVE badge di thumbnail
                if (!liveVideoId) {
                    const match3 = html.match(/"label":"LIVE"[^}]+"videoId":"([^"]+)"/);
                    if (match3) liveVideoId = match3[1];
                }
                
                if (liveVideoId) {
                    // Buka popup live chat
                    const chatUrl = `https://www.youtube.com/live_chat?v=${liveVideoId}&is_popout=1`;
                    const popup = window.open(chatUrl, 'livechat', 'width=400,height=600,left=' + (screen.width - 420) + ',top=100');
                    
                    if (popup) {
                        document.getElementById('liveStatus').innerHTML = '<span style="color:#00ff00;">🟢 LIVE! Chat di popup</span>';
                        document.getElementById('chatLoading').innerHTML = '<div style="font-size:30px;">✅</div><div style="font-size:11px;">Live chat terbuka di popup!</div><div style="font-size:9px;color:#666;">Kalo kegedean, resize aja</div>';
                        
                        // Juga tampilin di iframe kalo bisa
                        document.getElementById('chatContainer').innerHTML = `
                            <iframe src="https://www.youtube.com/live_chat?v=${liveVideoId}&embed_domain=${window.location.hostname}" 
                                    width="100%" height="100%" frameborder="0" allowfullscreen 
                                    onerror="this.style.display='none'">
                            </iframe>
                        `;
                        document.getElementById('chatLoading').style.display = 'none';
                        
                        toast('💬 Live chat terbuka!');
                    } else {
                        // Popup diblokir, coba iframe aja
                        document.getElementById('chatContainer').innerHTML = `
                            <iframe src="https://www.youtube.com/live_chat?v=${liveVideoId}" 
                                    width="100%" height="100%" frameborder="0" allowfullscreen>
                            </iframe>
                        `;
                        document.getElementById('chatLoading').style.display = 'none';
                        document.getElementById('liveStatus').innerHTML = '<span style="color:#00ff00;">🟢 LIVE!</span>';
                        toast('💬 Popup diblokir, chat di bawah');
                    }
                } else {
                    document.getElementById('liveStatus').textContent = '⚪ Tidak live';
                    document.getElementById('chatLoading').innerHTML = '<div style="font-size:30px;">😴</div><div style="font-size:11px;">TheMoiLee sedang tidak live</div><div style="font-size:9px;color:#666;">Cek lagi nanti ya</div>';
                    toast('❌ Tidak ada live');
                }
            } catch (e) {
                // Fallback: buka channel langsung
                document.getElementById('liveStatus').textContent = '⚠️ Error';
                document.getElementById('chatLoading').innerHTML = '<div style="font-size:30px;">❌</div><div style="font-size:11px;">Gagal cek live</div><div style="font-size:9px;color:#666;">Klik untuk buka channel</div>';
                
                // Buka channel di tab baru
                const channelUrl = `https://www.youtube.com/@TheMoiLee/live`;
                window.open(channelUrl, '_blank');
                toast('📺 Buka YouTube di tab baru');
            }
        }
        
        // ===== INIT =====
        updVol(75);
        
        // Auto cek live tiap 2 menit
        setInterval(async () => {
            try {
                const r = await fetch(`https://www.youtube.com/@TheMoiLee`);
                const h = await r.text();
                if (h.includes('"label":"LIVE"') || h.includes('"isLive":true') || h.includes('"liveBadge"')) {
                    document.getElementById('liveStatus').innerHTML = '<span style="color:#0f0;animation:blink 1s infinite">🔴 LIVE SEKARANG!</span>';
                }
            } catch(e) {}
        }, 120000);
    </script>
</body>
</html>
