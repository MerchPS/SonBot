<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Bimoli Soundboard + Live</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --body-bg: #05060a;
            --bezel: #1a1b20;
            --bezel-2: #202126;
            --key: #26272e;
            --key-hi: #313239;
            --key-shadow: rgba(0,0,0,0.55);
            --line: rgba(255,255,255,0.06);
            --gold: #ffb400;
            --gold-dim: #7a5c12;
            --coral: #ff5d5d;
            --teal: #2fd6ac;
            --text: #f2efe6;
            --text-dim: #888f9e;
            --font-display: 'Sora', system-ui, sans-serif;
            --font-body: 'Inter', system-ui, sans-serif;
            --font-mono: ui-monospace, 'SF Mono', Menlo, monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body { height: 100%; }
        body {
            font-family: var(--font-body);
            background: radial-gradient(120% 140% at 50% -10%, #10121a 0%, var(--body-bg) 55%);
            color: var(--text);
            user-select: none;
            overflow: hidden;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* ============ DECK (soundboard hardware shell) ============ */
        .deck {
            background: linear-gradient(180deg, var(--bezel-2), var(--bezel));
            border-bottom: 1px solid var(--line);
            padding: 10px 10px 8px;
            flex: 0 0 auto;
            max-height: 46vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        /* subtle hardware screws in the corners, like a real deck's bezel */
        .deck::before, .deck::after,
        .screw-tr, .screw-bl {
            content: '';
            position: absolute;
            width: 6px; height: 6px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #4a4b52, #101116 70%);
            box-shadow: 0 0 0 1px rgba(0,0,0,0.5);
        }
        .deck::before { top: 8px; left: 8px; }
        .deck::after { bottom: 8px; left: 8px; }
        .screw-tr { top: 8px; right: 8px; }
        .screw-bl { bottom: 8px; right: 8px; }

        .deck-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 8px 8px;
        }
        .brand {
            font-family: var(--font-display);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.5px;
            display: flex; align-items: center; gap: 7px;
        }
        .power-led {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--coral);
            box-shadow: 0 0 6px var(--coral);
            transition: background 0.2s, box-shadow 0.2s;
        }
        .power-led.on { background: var(--teal); box-shadow: 0 0 7px var(--teal); }
        .conn-label { font-family: var(--font-mono); font-size: 9px; color: var(--text-dim); }

        /* volume module styled like a hardware fader strip */
        .volume-module {
            background: var(--key);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 8px 10px;
            margin: 0 8px 8px;
        }
        .volume-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
        .volume-label { font-size: 9.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.6px; }
        .volume-value { font-family: var(--font-mono); font-size: 13px; color: var(--gold); font-weight: 700; }
        .volume-presets { display: flex; gap: 4px; margin-bottom: 6px; }
        .volume-preset {
            flex: 1; padding: 4px; border-radius: 6px;
            border: 1px solid var(--line);
            background: var(--bezel);
            color: var(--text-dim);
            cursor: pointer;
            font-family: var(--font-mono);
            font-size: 9px; text-align: center;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }
        .volume-preset.active { background: var(--gold); color: #1a1300; border-color: var(--gold); font-weight: 700; }
        .volume-slider-row { display: flex; align-items: center; gap: 8px; }
        .volume-slider-row span { font-size: 12px; opacity: 0.65; }
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%; height: 6px;
            border-radius: 4px;
            outline: none;
            background: linear-gradient(90deg, var(--gold) 0%, var(--gold) var(--fill, 75%), var(--bezel) var(--fill, 75%), var(--bezel) 100%);
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px; height: 16px;
            background: var(--text);
            border-radius: 50%;
            border: 2px solid var(--gold);
            cursor: pointer;
        }
        input[type="range"]::-moz-range-thumb {
            width: 16px; height: 16px;
            background: var(--text);
            border-radius: 50%;
            border: 2px solid var(--gold);
            cursor: pointer;
        }

        /* ============ KEY GRID (the actual stream-deck buttons) ============ */
        .key-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
            gap: 8px;
            padding: 2px 8px;
            flex: 1;
            overflow-y: auto;
        }
        .key {
            aspect-ratio: 1 / 1;
            border-radius: 11px;
            border: 1px solid rgba(255,255,255,0.05);
            background: linear-gradient(155deg, var(--key-hi) 0%, var(--key) 55%, #1e1f24 100%);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.07),
                inset 0 -6px 10px rgba(0,0,0,0.35),
                0 3px 5px rgba(0,0,0,0.45);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 4px 2px;
            position: relative;
            transition: transform 0.06s ease, box-shadow 0.1s ease, background 0.1s ease;
        }
        .key::after {
            /* screen glow ring, only visible on press */
            content: '';
            position: absolute; inset: 0;
            border-radius: 11px;
            box-shadow: 0 0 0 0 var(--gold);
            transition: box-shadow 0.15s ease;
            pointer-events: none;
        }
        .key:hover { transform: translateY(-1px); }
        .key:active {
            transform: translateY(1px) scale(0.97);
            background: linear-gradient(155deg, #ffc94d, var(--gold) 60%, #e6a100 100%);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.4);
        }
        .key:active::after { box-shadow: 0 0 14px 2px rgba(255,180,0,0.55); }
        .key:active .key-name,
        .key:active .key-count { color: #1a1300; }
        .key-icon { font-size: 20px; line-height: 1; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.4)); }
        .key-name { font-weight: 600; font-size: 9.5px; text-align: center; word-break: break-word; line-height: 1.15; }
        .key-count { font-family: var(--font-mono); font-size: 7px; color: var(--text-dim); }
        .empty-state { grid-column: 1/-1; text-align: center; padding: 22px 10px; color: var(--text-dim); font-size: 12px; }

        .deck-footer { display: flex; gap: 6px; padding: 8px 8px 0; }
        .btn {
            flex: 1; padding: 10px; border: none; border-radius: 9px;
            cursor: pointer; font-family: var(--font-display); font-size: 12px; font-weight: 700;
            letter-spacing: 0.3px;
            transition: filter 0.12s, transform 0.08s;
        }
        .btn-stop { background: var(--coral); color: #2a0a0a; box-shadow: 0 2px 0 #b93838; }
        .btn-chat { background: transparent; color: var(--teal); border: 1.5px solid var(--teal); }
        .btn:active { transform: translateY(1px); filter: brightness(1.05); }

        /* ============ CHAT PANEL ============ */
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--body-bg);
            min-height: 0;
        }
        .chat-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 12px;
            background: var(--bezel-2);
            border-bottom: 1px solid var(--line);
            font-size: 10.5px;
            flex: 0 0 auto;
        }
        .chat-header-label { color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
        #liveStatus { color: var(--text); font-weight: 600; }
        .live-badge {
            display: none;
            align-items: center; gap: 4px;
            color: var(--teal);
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 10px;
        }
        .live-badge::before {
            content: '';
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--teal);
            animation: pulse 1.4s ease-in-out infinite;
        }
        .retry-btn {
            font-family: var(--font-mono);
            font-size: 9px;
            color: var(--gold);
            background: transparent;
            border: 1px solid var(--gold-dim);
            border-radius: 6px;
            padding: 3px 8px;
            cursor: pointer;
        }
        .chat-iframe-container { flex: 1; position: relative; background: var(--body-bg); min-height: 0; }
        .chat-iframe-container iframe { width: 100%; height: 100%; border: none; }
        .chat-placeholder {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 10px; text-align: center; color: var(--text-dim); padding: 20px;
        }
        .chat-placeholder .icon { font-size: 34px; opacity: 0.8; }
        .chat-placeholder .title { font-size: 13px; color: var(--text); font-weight: 600; }
        .chat-placeholder .sub { font-size: 11px; }
        .spinner {
            width: 22px; height: 22px;
            border: 2.5px solid var(--key);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .toast {
            position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
            background: var(--key);
            border: 1px solid var(--gold-dim);
            color: var(--text);
            padding: 8px 16px; border-radius: 20px; font-size: 12px;
            z-index: 9999; animation: slideDown 0.3s; pointer-events: none;
            font-family: var(--font-mono);
        }

        @keyframes slideDown { from { opacity: 0; transform: translateX(-50%) translateY(-16px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
        @keyframes spin { to { transform: rotate(360deg); } }

        ::-webkit-scrollbar { width: 3px; height: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 3px; }

        /* ============ RESPONSIVE: PC / wide tablets ============ */
        @media (min-width: 860px) {
            .app { flex-direction: row; }
            .deck {
                flex: 0 0 380px;
                max-height: none;
                height: 100vh;
                border-bottom: none;
                border-right: 1px solid var(--line);
            }
            .key-grid { grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); }
            .chat-panel { height: 100vh; }
        }

        @media (min-width: 1200px) {
            .deck { flex-basis: 430px; }
            .key-grid { grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 10px; }
            .key-icon { font-size: 24px; }
            .key-name { font-size: 10.5px; }
        }

        @media (max-width: 340px) {
            .key-grid { grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- DECK -->
        <div class="deck">
            <span class="screw-tr"></span><span class="screw-bl"></span>
            <div class="deck-header">
                <span class="brand"><span class="power-led" id="powerLed"></span>BIMOLI DECK</span>
                <span class="conn-label" id="status">connecting</span>
            </div>

            <div class="volume-module">
                <div class="volume-row"><span class="volume-label">Volume</span><span class="volume-value" id="volumeValue">75%</span></div>
                <div class="volume-presets">
                    <button class="volume-preset" onclick="setVol(0.25)">25%</button>
                    <button class="volume-preset" onclick="setVol(0.5)">50%</button>
                    <button class="volume-preset active" onclick="setVol(0.75)">75%</button>
                    <button class="volume-preset" onclick="setVol(1.0)">100%</button>
                </div>
                <div class="volume-slider-row">
                    <span>&#128266;</span>
                    <input type="range" id="volSlider" min="0" max="100" value="75" oninput="updVol(this.value)" onchange="setVol2(this.value)" aria-label="Volume">
                </div>
            </div>

            <div class="key-grid" id="soundGrid">
                <div class="empty-state">Memuat daftar suara...</div>
            </div>

            <div class="deck-footer">
                <button class="btn btn-stop" onclick="stopAll()">Stop</button>
                <button class="btn btn-chat" onclick="loadLiveChat()">Cek Live</button>
            </div>
        </div>

        <!-- LIVE CHAT -->
        <div class="chat-panel">
            <div class="chat-header">
                <span class="chat-header-label">Live chat &middot; <span id="liveStatus">klik Cek Live</span></span>
                <span class="live-badge" id="liveBadge">LIVE</span>
            </div>
            <div class="chat-iframe-container" id="chatContainer">
                <div class="chat-placeholder">
                    <div class="icon">&#128172;</div>
                    <div class="title">Belum ada live chat dimuat</div>
                    <div class="sub">Tekan tombol "Cek Live" di deck</div>
                </div>
            </div>
        </div>
    </div>

    <div id="toastContainer"></div>

    <script>
        // ===== CONFIG =====
        const CHANNEL_HANDLE = '@TheMoiLee';

        // ===== SOUNDBOARD =====
        const socket = io();
        let semuaSuara = [];
        let vol = 0.75;
        let liveVideoId = null;
        let liveCheckInFlight = false;

        socket.on('connect', () => { setStatus(true); socket.emit('get_sounds'); });
        socket.on('disconnect', () => { setStatus(false); });
        socket.on('sounds_list', (data) => {
            if (data.status === 'ok') {
                semuaSuara = data.suara;
                renderSuara();
                if (data.volume) { vol = data.volume; updVol(vol * 100); }
            }
        });
        socket.on('play_response', (data) => { if (data.status === 'ok') toast('▶ ' + data.nama_suara); });

        // Backend emits this after a 'check_live' request (server.py handles the
        // actual YouTube lookup so it's not limited by browser CORS).
        socket.on('live_status', (data) => {
            liveCheckInFlight = false;
            if (data && data.videoId) {
                applyLiveState(data.videoId);
            } else {
                document.getElementById('liveStatus').textContent = 'tidak live';
                setChatPlaceholder('😴', 'Sedang tidak live', 'Coba cek lagi beberapa saat lagi', true);
            }
        });

        function setStatus(ok) {
            document.getElementById('status').textContent = ok ? 'online' : 'offline';
            document.getElementById('powerLed').classList.toggle('on', ok);
        }

        function updVol(v) {
            v = parseInt(v);
            document.getElementById('volSlider').style.setProperty('--fill', v + '%');
            document.getElementById('volSlider').value = v;
            document.getElementById('volumeValue').textContent = v + '%';
        }
        function setVol2(v) { vol = v / 100; socket.emit('set_volume', { volume: vol }); updVol(v); }
        function setVol(v) {
            vol = v; updVol(v * 100);
            socket.emit('set_volume', { volume: v });
            document.querySelectorAll('.volume-preset').forEach(b => {
                b.classList.toggle('active', Math.abs(parseFloat(b.textContent) / 100 - v) < 0.01);
            });
        }

        function renderSuara() {
            const grid = document.getElementById('soundGrid');
            grid.innerHTML = '';
            if (semuaSuara.length === 0) {
                grid.innerHTML = '<div class="empty-state">Belum ada suara</div>';
                return;
            }
            const em = { Bimoli: '🎭', Gaming: '🎮', Meme: '😂', Efek: '💥' };
            semuaSuara.sort((a, b) => (b.jumlah_main || 0) - (a.jumlah_main || 0));
            semuaSuara.forEach(s => {
                const key = document.createElement('div');
                key.className = 'key';
                key.onclick = () => socket.emit('play_sound', { nama_file: s.nama_file, volume: vol });
                key.innerHTML = `<div class="key-icon">${em[s.kategori] || '🔊'}</div><div class="key-name">${s.nama}</div><div class="key-count">${s.jumlah_main || 0}x</div>`;
                grid.appendChild(key);
            });
        }

        function stopAll() { socket.emit('stop_all'); toast('■ Stopped'); }
        function toast(m) {
            const c = document.getElementById('toastContainer');
            const t = document.createElement('div');
            t.className = 'toast';
            t.textContent = m;
            c.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(() => t.remove(), 300); }, 1500);
        }

        // ===== LIVE CHAT =====
        // Client-side fallback only (oEmbed, works for real watch URLs). The
        // primary path is the socket 'check_live' -> 'live_status' round trip
        // handled by server.py, which isn't limited by browser CORS.
        async function getLiveVideoIdFallback() {
            try {
                const url = `https://www.youtube.com/oembed?url=${encodeURIComponent('https://www.youtube.com/' + CHANNEL_HANDLE + '/live')}&format=json`;
                const res = await fetch(url);
                if (!res.ok) return null;
                const data = await res.json();
                const match = data.html && data.html.match(/embed\/([a-zA-Z0-9_-]+)/);
                return match ? match[1] : null;
            } catch (e) {
                return null;
            }
        }

        function setChatPlaceholder(icon, title, sub, showRetry) {
            document.getElementById('chatContainer').innerHTML = `
                <div class="chat-placeholder">
                    <div class="icon">${icon}</div>
                    <div class="title">${title}</div>
                    <div class="sub">${sub}</div>
                    ${showRetry ? '<button class="retry-btn" onclick="loadLiveChat()">Coba lagi</button>' : ''}
                </div>`;
        }

        function applyLiveState(videoId) {
            liveVideoId = videoId;
            document.getElementById('liveStatus').textContent = 'sedang live';
            document.getElementById('liveBadge').style.display = 'inline-flex';

            // sandbox WITHOUT allow-top-navigation stops YouTube from force-redirecting
            // the whole page if embed_domain ever mismatches.
            document.getElementById('chatContainer').innerHTML = `
                <iframe
                    src="https://www.youtube.com/live_chat?v=${videoId}&embed_domain=${window.location.hostname}"
                    sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-forms"
                    allow="autoplay; encrypted-media"
                    referrerpolicy="strict-origin-when-cross-origin"
                    loading="lazy">
                </iframe>`;
            toast('Live chat dimuat');
        }

        async function loadLiveChat() {
            if (liveCheckInFlight) return;
            liveCheckInFlight = true;

            document.getElementById('liveStatus').textContent = 'mencari...';
            document.getElementById('liveBadge').style.display = 'none';
            document.getElementById('chatContainer').innerHTML = `
                <div class="chat-placeholder">
                    <div class="spinner"></div>
                    <div class="sub">Mengecek status live...</div>
                </div>`;

            // Ask the backend (reliable, no CORS). If it doesn't answer within 4s
            // (e.g. older server.py without the handler), fall back to the client check.
            socket.emit('check_live');
            const timeout = setTimeout(async () => {
                if (!liveCheckInFlight) return;
                const videoId = await getLiveVideoIdFallback();
                liveCheckInFlight = false;
                if (videoId) {
                    applyLiveState(videoId);
                } else {
                    document.getElementById('liveStatus').textContent = 'tidak live';
                    setChatPlaceholder('😴', 'Sedang tidak live', 'Coba cek lagi beberapa saat lagi', true);
                }
            }, 4000);

            socket.once('live_status', () => clearTimeout(timeout));
        }

        // ===== AUTO CHECK EVERY 1 MINUTE =====
        setInterval(() => {
            if (liveCheckInFlight) return;
            socket.emit('check_live');
        }, 60000);

        // ===== INIT =====
        updVol(75);
        setStatus(false);
    </script>
</body>
</html>
